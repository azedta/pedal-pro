<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Book — Choose Service | Pedal Pro</title>

    <!-- Favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../assets/favicon/favicon-16x16.png"
    />
    <link rel="manifest" href="../assets/favicon/site.webmanifest" />
    <link rel="icon" href="../assets/favicon/favicon.ico" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Sora:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- UI -->
    <link rel="stylesheet" href="../css/app.css" />
  </head>

  <body>
    <!-- NAV -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top pp-nav">
      <div class="container pp-container">
        <a
          class="navbar-brand pp-brand d-flex align-items-center gap-2"
          href="../index.html"
        >
          <img src="../assets/logos/full-logo.png" alt="Pedal Pro" />
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#ppNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="ppNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
            <li class="nav-item">
              <a class="nav-link" href="services.html">Services</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
            <li class="nav-item ms-lg-2">
              <a class="pp-cta" href="book.html">BOOK NOW</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <header class="pp-section pb-0">
      <div class="pp-container">
        <div class="pp-kicker"><span class="pp-dot"></span> STEP 1 OF 4</div>
        <h1 class="pp-h1" style="font-size: clamp(2rem, 3.2vw, 3rem)">
          Choose your service.
        </h1>
        <p class="pp-lead mb-0">
          Booking with <span class="expert-name fw-bold">—</span>. Pick one
          service to continue.
        </p>
      </div>
    </header>

    <main>
      <section class="pp-section">
        <div class="pp-container">
          <div class="pp-panel p-4 p-lg-5">
            <div
              class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3"
            >
              <a
                class="btn btn-outline-dark pp-btn pp-btn-ghost"
                href="book.html"
                >← Back</a
              >

              <!-- IMPORTANT: this triggers storing service+length before navigating -->
              <a
                id="ppContinueBtn"
                class="btn btn-dark pp-btn pp-btn-primary pp-disabled"
                href="book-time.html"
                aria-disabled="true"
              >
                Continue
              </a>
            </div>

            <!-- IMPORTANT: keep these classes: .repair-item + .service-name + .list-group-item-check -->
            <div class="list-group list-group-checkable d-grid gap-3">
              <input
                class="list-group-item-check"
                type="radio"
                name="ppServiceRadios"
                id="ppSvc1"
              />

              <label class="list-group-item px-4 py-4 repair-item" for="ppSvc1">
                <div
                  class="d-flex justify-content-between align-items-start gap-3"
                >
                  <div>
                    <p
                      class="mb-1 service-name fw-bold"
                      style="letter-spacing: 0.12em"
                    >
                      WHEELS
                    </p>
                    <div class="text-white-50">
                      Alignment, truing, and smoother riding.
                    </div>
                  </div>
                  <div class="text-white-50">~45 min</div>
                </div>
              </label>

              <input
                class="list-group-item-check"
                type="radio"
                name="ppServiceRadios"
                id="ppSvc2"
              />
              <label class="list-group-item px-4 py-4 repair-item" for="ppSvc2">
                <div
                  class="d-flex justify-content-between align-items-start gap-3"
                >
                  <div>
                    <p
                      class="mb-1 service-name fw-bold"
                      style="letter-spacing: 0.12em"
                    >
                      PEDALS &amp; BRAKES
                    </p>
                    <div class="text-white-50">
                      Reliable braking and safe pedal performance.
                    </div>
                  </div>
                  <div class="text-white-50">~60 min</div>
                </div>
              </label>

              <input
                class="list-group-item-check"
                type="radio"
                name="ppServiceRadios"
                id="ppSvc3"
              />
              <label class="list-group-item px-4 py-4 repair-item" for="ppSvc3">
                <div
                  class="d-flex justify-content-between align-items-start gap-3"
                >
                  <div>
                    <p
                      class="mb-1 service-name fw-bold"
                      style="letter-spacing: 0.12em"
                    >
                      CASETTE
                    </p>
                    <div class="text-white-50">
                      Smoother shifting and drivetrain checks.
                    </div>
                  </div>
                  <div class="text-white-50">~20 min</div>
                </div>
              </label>

              <input
                class="list-group-item-check"
                type="radio"
                name="ppServiceRadios"
                id="ppSvc4"
              />
              <label class="list-group-item px-4 py-4 repair-item" for="ppSvc4">
                <div
                  class="d-flex justify-content-between align-items-start gap-3"
                >
                  <div>
                    <p
                      class="mb-1 service-name fw-bold"
                      style="letter-spacing: 0.12em"
                    >
                      FRAME
                    </p>
                    <div class="text-white-50">
                      Safety inspection for stability and comfort.
                    </div>
                  </div>
                  <div class="text-white-50">~20 min</div>
                </div>
              </label>
            </div>

            <div class="text-white-50 mt-4" style="line-height: 1.6">
              You’ll confirm everything before finalizing.
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="pp-footer">
      <div
        class="pp-container d-flex flex-wrap justify-content-between align-items-center gap-2"
      >
        <small>© <span id="ppYear"></span> Pedal Pro</small>
        <small>Premium service • Easy booking</small>
      </div>
    </footer>

    <script>
      document.getElementById("ppYear").textContent =
        new Date().getFullYear() - 2;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="../js/book-service.js"></script>
  </body>
</html>
